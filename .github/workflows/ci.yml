name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install
          npm --prefix client ci || npm --prefix client install

      - name: Run client linter (Oxlint Zero-Warning Policy)
        run: npm run lint

      - name: Run backend quantitative test suite
        run: npm test

      - name: Build client production bundle
        run: npm run build
