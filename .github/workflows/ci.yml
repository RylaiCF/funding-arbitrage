name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: |
          npm ci || npm install
          npm --prefix client ci || npm --prefix client install

      - name: Run client linter (Oxlint Zero-Warning Policy)
        run: npm run lint

      - name: Run backend quantitative test suite
        run: npm test

      - name: Build client production bundle
        run: npm run build
